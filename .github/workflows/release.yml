name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    # Compiled against the macOS 27 SDK (Xcode 27). The result still runs on
    # macOS 26: the 26 SDK cannot build it, since the glass views use 27 API.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/build
          key: swift-release-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swift-release-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      - name: Build
        run: NO_INSTALL=1 SCRATCH="$RUNNER_TEMP/build" ./Scripts/build-app.sh release
      - name: Package
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/build/LaunchpadNative.app" LaunchpadNative.zip
          shasum -a 256 LaunchpadNative.zip > LaunchpadNative.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LaunchpadNative
          path: LaunchpadNative.zip*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: LaunchpadNative
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LaunchpadNative.zip LaunchpadNative.zip.sha256 --repo "$GITHUB_REPOSITORY" --generate-notes
