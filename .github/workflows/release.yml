name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Compiled against the macOS 27 SDK (Xcode 27). The result still runs on
    # macOS 26: the 26 SDK cannot build it, since the glass views use 27 API.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: NO_INSTALL=1 SCRATCH="$RUNNER_TEMP/build" ./Scripts/build-app.sh release
      - name: Package
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/build/LaunchpadNative.app" LaunchpadNative.zip
          shasum -a 256 LaunchpadNative.zip > LaunchpadNative.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: LaunchpadNative
          path: LaunchpadNative.zip*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: LaunchpadNative
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LaunchpadNative.zip LaunchpadNative.zip.sha256 --repo "$GITHUB_REPOSITORY" --generate-notes
