name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos27, runner: xcode-27 }
          - { name: macos26, runner: macos-26 }
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: NO_INSTALL=1 SCRATCH="$RUNNER_TEMP/build" ./Scripts/build-app.sh release
      - name: Package
        run: |
          zip="LaunchpadNative-${{ matrix.name }}.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/build/LaunchpadNative.app" "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: LaunchpadNative-${{ matrix.name }}
          path: LaunchpadNative-${{ matrix.name }}.zip*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: LaunchpadNative-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LaunchpadNative-*.zip* --repo "$GITHUB_REPOSITORY" --generate-notes
