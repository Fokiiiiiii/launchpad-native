name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The release workflow runs this first, so nothing is published from a commit
  # whose tests have not passed.
  workflow_call:

permissions:
  contents: read

concurrency:
  # The workflow name is the caller's when this is called, so a release run and a
  # push run on the same commit do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app is compiled against the macOS 27 SDK, which ships with Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: ./Scripts/restore-mtimes.sh
      # There are no package dependencies, so the build directory is the whole
      # cache. A run starts from the newest one and rebuilds only what changed.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build
          key: swift-debug-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swift-debug-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
